<!DOCTYPE html>

		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #2e6b33;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<style>@font-face{font-family:Pixelify;src:url("PixelifySans-Regular.ttf") format("truetype");font-display:swap}#status{visibility:visible!important;z-index:5}#status::after{content:"Sheepdog Lite";position:absolute;top:9%;left:0;width:100%;text-align:center;z-index:2;pointer-events:none;font-family:Pixelify,sans-serif;font-size:clamp(2rem,6.5vw,3.6rem);color:#f4e6c3;text-shadow:3px 3px 0 #3a2614,-1px -1px 0 #3a2614,1px -1px 0 #3a2614,-1px 1px 0 #3a2614,1px 1px 0 #3a2614}#status-splash{image-rendering:pixelated}#status-progress::-webkit-progress-bar{background:rgba(20,32,16,.45)}#status-progress::-webkit-progress-value{background:#f4e6c3}#status-progress::-moz-progress-bar{background:#f4e6c3}</style><meta name="mobile-web-app-capable" content="yes" /><meta name="apple-mobile-web-app-capable" content="yes" /><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" /><script>(function(){function fix(){var i=document.getElementById("status-splash");if(i&&i.src.indexOf("v=field")<0)i.src="index.png?v=field"}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",fix);else fix()})();</script>

body { background: #263b20; overscroll-behavior: none; }
#safe-stage { position: fixed; inset: 0; padding: max(env(safe-area-inset-top), var(--browser-notice-space, 0px)) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); display: flex; align-items: center; justify-content: center; }

<style>
#inapp-browser-banner {
 position: fixed; top: max(8px, env(safe-area-inset-top));
 left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right));
 z-index: 9999; max-width: 680px; margin: 0 auto; box-sizing: border-box;
 padding: 10px 12px; border: 1px solid #a8b98b; border-radius: 12px;
 background: #20331ef5; color: #fff4d6; font: 14px/1.4 sans-serif;
 display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 12px;
}
#inapp-browser-banner p { margin: 0; flex: 1 1 150px; }
#inapp-browser-banner .actions { display: flex; gap: 8px; }
#inapp-browser-banner a, #inapp-browser-banner button {
 display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box;
 min-height: 44px; padding: 9px 12px; border: 1px solid #c8c8a0; border-radius: 8px;
 font: 600 14px sans-serif; text-decoration: none; cursor: pointer;
}
#inapp-browser-banner a { background: #fff4d6; color: #20331e; }
#inapp-browser-banner button { background: transparent; color: #fff4d6; }
#inapp-browser-banner .fallback { flex-basis: 100%; font-size: 13px; }
</style>
<script id="inapp-browser-choice">
(function () {
 const ua = navigator.userAgent || '';
 const android = /Android/i.test(ua), ios = /iPhone|iPad|iPod/i.test(ua);
 const threads = /Barcelona/i.test(ua), instagram = /Instagram/i.test(ua) && !threads;
 const inapp = /Instagram|Barcelona|FBAN|FBAV|FB_IAB|Line\/|Twitter|Snapchat|Bytedance|musical_ly|TikTok/i.test(ua);
 if (!inapp) return;
 function browserHref() {
  const url = location.href;
  if (android) return 'intent://' + location.host + location.pathname + location.search + location.hash +
   '#Intent;scheme=' + location.protocol.replace(':', '') + ';package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(url) + ';end';
  if (threads) return 'barcelona://extbrowser/?url=' + encodeURIComponent(url);
  if (instagram) return 'instagram://extbrowser/?url=' + encodeURIComponent(url);
  if (ios) return url.replace(/^https:/, 'x-safari-https:').replace(/^http:/, 'x-safari-http:');
  return url;
 }
 function mount() {
  if (document.getElementById('inapp-browser-banner')) return;
  const banner = document.createElement('aside');
  banner.id = 'inapp-browser-banner';
  banner.setAttribute('aria-label', 'Browser choice');
  const copy = document.createElement('p');
  copy.textContent = instagram ? 'Opened in Instagram. Choose where to play.' : 'Opened in an in-app browser. Choose where to play.';
  const actions = document.createElement('div');
  actions.className = 'actions';
  const open = document.createElement('a');
  open.textContent = 'Open in browser';
  open.href = browserHref();
  open.rel = 'noopener external';
  const fallback = document.createElement('p');
  fallback.className = 'fallback';
  fallback.hidden = true;
  fallback.textContent = 'If nothing opens, use the app’s menu (⋯) and choose “Open in browser”, or keep playing here.';
  open.addEventListener('click', function () {
   // External-app navigation happens only from this explicit user tap.
   open.href = browserHref();
   fallback.hidden = false;
   requestAnimationFrame(reserveSpace);
  });
  const stay = document.createElement('button');
  stay.type = 'button';
  stay.textContent = 'Play here';
  function reserveSpace() {
   document.documentElement.style.setProperty('--browser-notice-space', (banner.getBoundingClientRect().bottom + 8) + 'px');
   window.dispatchEvent(new Event('resize'));
  }
  const observer = new ResizeObserver(reserveSpace);
  stay.addEventListener('click', function () {
   observer.disconnect();
   banner.remove();
   document.documentElement.style.removeProperty('--browser-notice-space');
   window.dispatchEvent(new Event('resize'));
   document.getElementById('canvas')?.focus();
  });
  actions.append(open, stay);
  banner.append(copy, actions, fallback);
  document.body.appendChild(banner);
  observer.observe(banner);
  reserveSpace();
 }
 if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount);
 else mount();
}());
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":3747224,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);
	// Own the canvas size so browser chrome and notches cannot cover the controls.
	const gameCanvas = document.getElementById('canvas');
	const stage = document.getElementById('safe-stage');
	let blurred = false;
	function syncStage() {
		const box = stage.getBoundingClientRect(), css = getComputedStyle(stage);
		const width = box.width - parseFloat(css.paddingLeft) - parseFloat(css.paddingRight);
		const height = box.height - parseFloat(css.paddingTop) - parseFloat(css.paddingBottom);
		const scale = Math.min(width / 1280, height / 720);
		gameCanvas.style.width = Math.floor(1280 * scale) + 'px';
		gameCanvas.style.height = Math.floor(720 * scale) + 'px';
		const dpr = Math.min(window.devicePixelRatio || 1, 2);
		const renderWidth = Math.max(1, Math.round(1280 * scale * dpr));
		const renderHeight = Math.max(1, Math.round(720 * scale * dpr));
		if (gameCanvas.width !== renderWidth) gameCanvas.width = renderWidth;
		if (gameCanvas.height !== renderHeight) gameCanvas.height = renderHeight;
		window.sheepdogSuspended = document.hidden || blurred;
	}
	window.addEventListener('resize', syncStage);
	window.visualViewport?.addEventListener('resize', syncStage);
	document.addEventListener('visibilitychange', syncStage);
	window.addEventListener('blur', () => { blurred = true; syncStage(); });
	window.addEventListener('focus', () => { blurred = false; syncStage(); });
	syncStage();

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			syncStage();
		}, displayFailureNotice);
	}
}());
		</script>
